<title>Manufacturing Business Manager</title>

<style>
/* Theme: black and orange, always dark. Orange (#f3881e) is the only brand colour; hazard-stripe accent nods to the workshop floor. */
:root {
  color-scheme: dark;
  --bg: #0a0a0a;
  --surface: #151515;
  --surface-2: #1f1f1f;
  --ink: #fff3e6;
  --text: #ece7e0;
  --muted: #a39a8f;
  --line: #2a2a2a;
  --line-strong: #3d3d3d;
  --primary: #f3881e;
  --on-primary: #150b00;
  --primary-hover: #f9a24d;
  --focus: #f9ae5c;
  --good: #5fd38d;
  --good-bg: #0f2a1a;
  --warn: #ffb347;
  --warn-bg: #2d1b06;
  --bad: #ff7468;
  --bad-bg: #351311;
  --info: #ffb067;
  --info-bg: #2a1a0b;
  --neutral-bg: #262626;
  --scrim: rgba(0, 0, 0, 0.78);
  --f-display: 'Barlow Condensed', 'sans-serif-condensed', 'Roboto Condensed', 'Arial Narrow', system-ui, sans-serif;
  --f-body: 'IBM Plex Sans', Roboto, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
  --f-mono: 'IBM Plex Mono', 'Roboto Mono', ui-monospace, Menlo, Consolas, monospace;
}
html { background: #0a0a0a; }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.45;
}
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, p { margin: 0; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.boot { padding: 48px 16px; text-align: center; color: var(--muted); }

/* navigation bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.bar-in { max-width: 1040px; margin: 0 auto; padding: 8px 16px; display: flex; align-items: center; gap: 8px; }
.bar-in .spacer { flex: 1; }
.wrap { max-width: 1040px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 56px; display: flex; flex-direction: column; gap: 20px; }
.page-title { font-family: var(--f-display); font-weight: 700; font-size: 34px; line-height: 1.05; color: var(--ink); letter-spacing: 0.005em; text-wrap: balance; }
.page-sub { color: var(--muted); margin-top: 4px; }
.masthead h1 { font-family: var(--f-display); font-weight: 700; font-size: clamp(34px, 7vw, 52px); line-height: 1; color: var(--ink); text-wrap: balance; }
.masthead p { margin-top: 8px; color: var(--muted); }
.masthead::after { content: ''; display: block; width: 72px; height: 4px; background: var(--ink); margin-top: 14px; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 10px 18px; border-radius: 4px; border: 1px solid var(--primary); background: var(--primary); color: var(--on-primary); font-weight: 600; cursor: pointer; text-align: center; line-height: 1.2; }
.btn:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
.btn:disabled { opacity: 0.55; cursor: not-allowed; }
.btn-secondary { background: var(--surface); color: var(--ink); border-color: var(--line-strong); }
.btn-secondary:hover { background: var(--surface-2); border-color: var(--ink); }
.btn-ghost { background: transparent; color: var(--ink); border-color: transparent; }
.btn-ghost:hover { background: var(--surface-2); border-color: transparent; }
.btn-danger { background: var(--surface); color: var(--bad); border-color: var(--bad); }
.btn-danger:hover { background: var(--bad-bg); border-color: var(--bad); }
.btn-danger-solid { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn-danger-solid:hover { background: var(--bad); filter: brightness(0.92); border-color: var(--bad); }
.btn-sm { min-height: 44px; padding: 8px 12px; font-size: 15px; }
.btn-row { display: flex; flex-wrap: wrap; gap: 10px; }

/* sections and cards */
.sec-title { font-family: var(--f-display); font-weight: 600; font-size: 16px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); padding-bottom: 6px; border-bottom: 1px solid var(--line); margin-bottom: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 16px; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 210px), 1fr)); gap: 12px; }
.cards-count { grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.stat .k { font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.stat .v { font-family: var(--f-display); font-weight: 700; font-size: 36px; line-height: 1.05; color: var(--ink); font-variant-numeric: tabular-nums; }
.stat .v-money { font-family: var(--f-mono); font-weight: 500; font-size: 19px; line-height: 1.3; color: var(--ink); overflow-wrap: anywhere; }
.stat .s { font-size: 13px; color: var(--muted); }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 12px; }
.tile { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; text-align: left; padding: 16px; min-height: 84px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--surface); color: var(--ink); cursor: pointer; }
.tile:hover { border-color: var(--ink); background: var(--surface-2); }
.tile strong { font-family: var(--f-display); font-weight: 700; font-size: 23px; line-height: 1.1; }
.tile span { color: var(--muted); font-size: 14px; }
.tile .tile-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.tile-primary { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.tile-primary span { color: inherit; opacity: 0.85; }
.tile-primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }

/* alerts, badges, tags */
.alert { border: 1px solid var(--warn); background: var(--warn-bg); color: var(--warn); border-radius: 6px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.alert strong { font-family: var(--f-display); font-size: 21px; font-weight: 700; }
.alert-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; color: var(--text); }
.alert-row .btn { background: var(--surface); color: var(--ink); border-color: var(--line-strong); }
.note { border: 1px solid var(--line-strong); border-radius: 6px; padding: 12px 14px; background: var(--surface); color: var(--text); font-size: 15px; }
.note.warn { border-color: var(--warn); background: var(--warn-bg); color: var(--warn); }
.note.info { border-color: var(--info); background: var(--info-bg); color: var(--info); }
.mode-banner { border-left: 4px solid var(--ink); background: var(--surface-2); padding: 10px 14px; border-radius: 0 4px 4px 0; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; }
.mode-banner b { font-family: var(--f-display); font-size: 20px; letter-spacing: 0.02em; color: var(--ink); }
.badge { display: inline-block; padding: 2px 9px; border-radius: 3px; font-size: 13px; font-weight: 600; line-height: 1.5; background: var(--neutral-bg); color: var(--text); white-space: nowrap; }
.b-good { background: var(--good-bg); color: var(--good); }
.b-warn { background: var(--warn-bg); color: var(--warn); }
.b-bad { background: var(--bad-bg); color: var(--bad); }
.b-info { background: var(--info-bg); color: var(--info); }
.tag { display: inline-block; padding: 1px 7px; border-radius: 3px; font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
.tag.bad { background: var(--bad-bg); color: var(--bad); }
.tag.warn { background: var(--warn-bg); color: var(--warn); }
.count-pill { display: inline-block; min-width: 24px; padding: 0 8px; border-radius: 12px; background: var(--warn-bg); color: var(--warn); font-size: 13px; font-weight: 700; text-align: center; }

/* forms */
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr)); gap: 14px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field.wide { grid-column: 1 / -1; }
.field > label, .field > .lbl { font-weight: 600; font-size: 14px; color: var(--ink); }
.field .hint { font-size: 13px; color: var(--muted); }
input[type="text"], input[type="password"], input[type="date"], input[type="number"], input[type="search"], select, textarea {
  width: 100%; min-height: 48px; padding: 10px 12px; border: 1px solid var(--line-strong); border-radius: 4px; background: var(--surface); color: var(--text);
}
textarea { min-height: 88px; resize: vertical; }
input[type="checkbox"] { width: 22px; height: 22px; accent-color: var(--primary); flex: none; }
input[readonly] { background: var(--surface-2); }
[aria-invalid="true"] { border-color: var(--bad) !important; box-shadow: inset 0 0 0 1px var(--bad); }
.field-err { color: var(--bad); font-size: 13px; font-weight: 600; margin-top: 2px; }
.check { display: flex; align-items: center; gap: 10px; min-height: 44px; }
.fieldset { border: 1px solid var(--line); border-radius: 6px; background: var(--surface); padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.fieldset > h2 { font-family: var(--f-display); font-weight: 700; font-size: 22px; color: var(--ink); }

/* cost table */
.cost-scroll { max-height: min(64vh, 680px); overflow: auto; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--surface); -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.cost-table { width: 100%; border-collapse: separate; border-spacing: 0; }
.cost-table th { position: sticky; top: 0; z-index: 2; background: var(--surface-2); text-align: left; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); padding: 10px 12px; border-bottom: 1px solid var(--line-strong); }
.cost-table th:last-child, .cost-table td:last-child { text-align: right; }
.cost-table td { padding: 4px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.cost-table td.p { padding-left: 12px; }
.cost-table td.p .n { display: inline-block; width: 26px; color: var(--muted); font-family: var(--f-mono); font-size: 13px; }
.cost-table td.a { width: 46%; min-width: 150px; }
.cost-table td.a input { text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; min-height: 44px; }
.cost-table tfoot td { position: sticky; bottom: 0; background: var(--surface-2); border-top: 2px solid var(--ink); border-bottom: none; font-weight: 700; padding: 10px 12px; color: var(--ink); }
.cost-table.readonly td.a { font-family: var(--f-mono); font-variant-numeric: tabular-nums; padding: 8px 12px; width: auto; }
.cost-table.readonly td.p { padding: 8px 12px; }
.totals { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 14px; align-items: start; }
.total-box { border: 2px solid var(--ink); border-radius: 6px; padding: 14px 16px; background: var(--surface); }
.total-box .k { font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.total-box .v { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-weight: 500; font-size: clamp(26px, 6vw, 36px); color: var(--ink); overflow-wrap: anywhere; }
.pos { color: var(--good); }
.neg { color: var(--bad); }

/* lists */
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.toolbar .grow { flex: 1 1 260px; min-width: 0; }
.toolbar select { width: auto; min-width: 190px; flex: 0 1 auto; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; -webkit-overflow-scrolling: touch; }
.chip { flex: none; min-height: 44px; padding: 8px 14px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); border-radius: 22px; cursor: pointer; font-weight: 500; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.list { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 440px), 1fr)); gap: 12px; }
.list > .empty { grid-column: 1 / -1; }
.item { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.item-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.item-title { font-weight: 700; font-size: 18px; color: var(--ink); overflow-wrap: anywhere; }
.item-sub { color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 14px; margin: 0; }
.facts dt { font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.facts dd { margin: 0; overflow-wrap: anywhere; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 10px; border-top: 1px solid var(--line); }
.empty { border: 1px dashed var(--line-strong); border-radius: 6px; padding: 28px 16px; text-align: center; color: var(--muted); display: flex; flex-direction: column; gap: 12px; align-items: center; background: var(--surface); }
.empty strong { font-family: var(--f-display); font-size: 22px; color: var(--ink); }
.detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 14px 20px; margin: 0; }
.detail-grid dt { font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.detail-grid dd { margin: 2px 0 0; overflow-wrap: anywhere; }
.detail-grid .wide { grid-column: 1 / -1; }
.table-wrap { overflow-x: auto; }
.plain-table { width: 100%; border-collapse: collapse; }
.plain-table th, .plain-table td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); font-size: 15px; }
.plain-table th { font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.stages { display: grid; gap: 8px; }
.stage { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 10px 14px; border: 1px solid var(--line-strong); border-radius: 4px; background: var(--surface); cursor: pointer; }
.stage:has(input:checked) { border-color: var(--primary); background: var(--info-bg); box-shadow: inset 0 0 0 1px var(--primary); }
.stage input { width: 20px; height: 20px; accent-color: var(--primary); flex: none; }
.stage .n { font-family: var(--f-mono); color: var(--muted); width: 22px; flex: none; }
.stage .cur { margin-left: auto; font-size: 12px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); }

/* toasts and dialog */
#toasts { position: fixed; left: 0; right: 0; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; align-items: center; gap: 8px; padding-inline: 16px; z-index: 60; pointer-events: none; }
.toast { pointer-events: auto; max-width: 560px; width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; border-radius: 6px; background: var(--ink); color: var(--bg); box-shadow: 0 6px 24px rgba(0, 0, 0, 0.28); font-weight: 500; }
.toast.err { background: var(--bad); color: #fff; }
.toast .btn { min-height: 36px; padding: 4px 12px; background: transparent; color: inherit; border-color: currentColor; }
.modal-back { position: fixed; inset: 0; z-index: 70; background: var(--scrim); display: grid; place-items: center; padding: 16px; }
.modal { background: var(--surface); color: var(--text); width: 100%; max-width: 480px; max-height: calc(100% - 32px); overflow: auto; border-radius: 8px; padding: 20px; box-shadow: 0 16px 48px rgba(0, 0, 0, 0.35); display: flex; flex-direction: column; gap: 14px; }
.modal h2 { font-family: var(--f-display); font-size: 26px; font-weight: 700; color: var(--ink); }
.modal textarea { min-height: 220px; font-family: var(--f-mono); font-size: 13px; }
.modal .btn-row { justify-content: flex-end; }

@media (max-width: 520px) {
  .page-title { font-size: 30px; }
  .facts { grid-template-columns: 1fr 1fr; }
  .toolbar select { width: 100%; }
  .btn-row > .btn.grow-sm { flex: 1 1 100%; }
}
@media (prefers-reduced-motion: no-preference) {
  .btn, .tile, .chip { transition: background-color 0.12s ease, border-color 0.12s ease; }
}


/* ===== black + orange look ===== */
body { background: radial-gradient(720px 340px at 90% -60px, rgba(243, 136, 30, 0.20), transparent 65%), #0a0a0a; background-repeat: no-repeat; }
::placeholder { color: #6d665e; opacity: 1; }
::selection { background: #f3881e; color: #150b00; }

/* top bar */
.bar { background: rgba(10, 10, 10, 0.94); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); border-bottom: 1px solid #262626; }
.bar::after { content: ''; display: block; height: 3px; background: linear-gradient(90deg, #f3881e, #f9ae5c 45%, rgba(243, 136, 30, 0) 100%); }

/* headings */
.page-title, .masthead h1 { color: #fff; letter-spacing: 0.01em; }
.masthead { padding-top: 6px; }
.masthead p { color: var(--muted); }
.masthead::after { width: 110px; height: 9px; border-radius: 2px; margin-top: 16px; background: repeating-linear-gradient(-45deg, #f3881e 0 9px, #0a0a0a 9px 18px); }
.sec-title { color: #f6a04a; border-bottom: 1px solid #2c2c2c; display: flex; align-items: center; gap: 10px; }
.sec-title::before { content: ''; width: 4px; height: 16px; border-radius: 2px; background: #f3881e; flex: none; }

/* buttons */
.btn { border-radius: 10px; font-weight: 700; letter-spacing: 0.01em; background: linear-gradient(180deg, #f79a3a, #e07410); border-color: #f3881e; color: #150b00; box-shadow: 0 4px 16px rgba(224, 116, 16, 0.28); }
.btn:hover { background: linear-gradient(180deg, #f9a44a, #f3881e); border-color: #f9a24d; }
.btn:active { transform: scale(0.98); }
.btn-secondary { background: #1b1b1b; color: #f3ede5; border-color: #3d3d3d; box-shadow: none; }
.btn-secondary:hover { background: #242424; border-color: #f3881e; color: #ffb067; }
.btn-ghost { background: transparent; color: #ffb067; border-color: transparent; box-shadow: none; }
.btn-ghost:hover { background: rgba(243, 136, 30, 0.12); border-color: transparent; }
.btn-danger { background: #1b1b1b; color: var(--bad); border-color: #6b2a25; box-shadow: none; }
.btn-danger:hover { background: var(--bad-bg); border-color: var(--bad); }
.btn-danger-solid { background: #d6322a; border-color: #d6322a; color: #fff; box-shadow: none; }

/* surfaces */
.card, .stat, .item, .fieldset, .empty, .tile, .note { background: linear-gradient(180deg, #1a1a1a, #141414); border-color: #2b2b2b; border-radius: 12px; }
.empty { border-style: dashed; border-color: #4a3a2a; }
.stat { border-left: 3px solid #f3881e; }
.stat .k { color: #b8aea2; }
.stat .v { color: #f5891e; }
.stat .v-money { color: #ffc48a; }
.stat .s { color: var(--muted); }
.item:hover { border-color: #4a3a2a; }
.item-title { color: #fff; }

/* dashboard tiles */
.tile { border-color: #333; }
.tile:hover { border-color: #f3881e; background: linear-gradient(180deg, #211a13, #17130f); }
.tile strong { color: #fff; }
.tile-primary { background: linear-gradient(135deg, #f79a3a 0%, #e07410 60%, #e85a00 100%); border-color: #f79a3a; color: #150b00; box-shadow: 0 8px 24px rgba(224, 116, 16, 0.30); }
.tile-primary strong { color: #150b00; }
.tile-primary span { color: #3a1c00; opacity: 1; }
.tile-primary:hover { background: linear-gradient(135deg, #f9a44a 0%, #f3881e 60%, #f06400 100%); border-color: #f9a44a; }

/* reminders and notes */
.alert { border: 1px solid #f3881e; border-left-width: 5px; background: linear-gradient(90deg, rgba(243, 136, 30, 0.20), rgba(243, 136, 30, 0.05)); color: #ffc58a; border-radius: 12px; }
.alert strong { color: #ffd9b0; }
.alert-row .btn { background: #1b1b1b; color: #ffb067; border-color: #f3881e; box-shadow: none; }
.note.info { background: rgba(243, 136, 30, 0.08); border-color: #5a3a1a; color: #ffc58a; }
.mode-banner { border-left-color: #f3881e; background: #1a1a1a; }
.mode-banner b { color: #fff; }
.count-pill { background: #f3881e; color: #150b00; }
.badge { border-radius: 6px; }
.tag.warn, .b-warn { background: #3a2308; color: #ffb347; }

/* forms */
.field > label, .field > .lbl { color: #f3ede5; }
input[type="text"], input[type="date"], input[type="number"], input[type="search"], select, textarea { background: #0f0f0f; border: 1px solid #3a3a3a; border-radius: 10px; color: #fff; }
input[type="text"]:focus, input[type="date"]:focus, input[type="number"]:focus, input[type="search"]:focus, select:focus, textarea:focus { outline: none; border-color: #f3881e; box-shadow: 0 0 0 3px rgba(243, 136, 30, 0.25); }
input[readonly] { background: #1a1a1a; color: #cfc6bb; }

/* calendar picker */

.cal { display: flex; flex-direction: column; gap: 10px; }

/* ===== Spatial UI: floating glass panels, depth and light (palette taken from the Spark Tech logo: orange #F3881E, white, black) ===== */
:root { --logo-orange: #f3881e; --glass: rgba(255, 255, 255, 0.07); --glass-strong: rgba(255, 255, 255, 0.11); --glass-edge: rgba(255, 255, 255, 0.16); --depth: 0 24px 48px -16px rgba(0, 0, 0, 0.75), 0 4px 14px rgba(0, 0, 0, 0.45); --hi: inset 0 1px 0 rgba(255, 255, 255, 0.20), inset 0 -1px 0 rgba(0, 0, 0, 0.35); }
html { background: #07070a; }
body { background: radial-gradient(900px 520px at 100% -10%, rgba(243, 136, 30, 0.34), transparent 62%), radial-gradient(760px 520px at -15% 38%, rgba(243, 136, 30, 0.14), transparent 60%), radial-gradient(620px 460px at 70% 108%, rgba(255, 255, 255, 0.07), transparent 65%), linear-gradient(180deg, #0d0d11, #07070a); background-attachment: fixed; background-repeat: no-repeat; }
#app { perspective: 1100px; }

/* floating glass navigation bar */
.bar { top: calc(env(safe-area-inset-top, 0px) + 8px); margin: 8px 10px 0; border: 1px solid var(--glass-edge); border-radius: 22px; background: rgba(24, 24, 30, 0.55); -webkit-backdrop-filter: blur(22px) saturate(170%); backdrop-filter: blur(22px) saturate(170%); box-shadow: var(--depth), var(--hi); overflow: hidden; }
.bar::after { height: 2px; background: linear-gradient(90deg, transparent, #f3881e 30%, #fff 50%, #f3881e 70%, transparent); opacity: 0.8; }
.bar-in { padding: 6px 10px; }
.brand-logo { filter: drop-shadow(0 2px 8px rgba(243, 136, 30, 0.35)); }

/* titles */
.page-title, .masthead h1 { text-shadow: 0 6px 30px rgba(243, 136, 30, 0.35); }
.masthead::after { background: linear-gradient(90deg, #f3881e, #fff); border-radius: 99px; height: 5px; width: 96px; box-shadow: 0 0 18px rgba(243, 136, 30, 0.7); }

/* glass panels */
.card, .stat, .fieldset, .tile, .note, .total-box, .cost-scroll, .empty, .item, .alert, .mode-banner, .stage, .sync-status {
  background: linear-gradient(145deg, rgba(255, 255, 255, 0.10), rgba(255, 255, 255, 0.035)); border: 1px solid var(--glass-edge); border-radius: 22px; box-shadow: var(--depth), var(--hi);
}
.stat, .fieldset, .tile, .total-box, .note { -webkit-backdrop-filter: blur(18px) saturate(150%); backdrop-filter: blur(18px) saturate(150%); }
.stat { border-left: 1px solid var(--glass-edge); position: relative; overflow: hidden; }
.stat::before { content: ''; position: absolute; left: 14px; right: 14px; top: 0; height: 3px; border-radius: 0 0 6px 6px; background: linear-gradient(90deg, #f3881e, rgba(243, 136, 30, 0)); }
.item { border-radius: 20px; }
.item:hover { border-color: rgba(243, 136, 30, 0.55); }
.empty { border-style: dashed; border-color: rgba(243, 136, 30, 0.4); }
.stage { border-radius: 16px; box-shadow: var(--hi); }
.stage:has(input:checked) { background: linear-gradient(145deg, rgba(243, 136, 30, 0.28), rgba(243, 136, 30, 0.08)); border-color: #f3881e; box-shadow: 0 0 0 1px #f3881e, 0 10px 28px -10px rgba(243, 136, 30, 0.6); }
.alert { border-left: 1px solid rgba(243, 136, 30, 0.6); background: linear-gradient(145deg, rgba(243, 136, 30, 0.30), rgba(243, 136, 30, 0.08)); box-shadow: var(--depth), 0 0 36px -8px rgba(243, 136, 30, 0.55), var(--hi); }
.total-box { border: 1px solid rgba(243, 136, 30, 0.6); box-shadow: var(--depth), 0 0 40px -12px rgba(243, 136, 30, 0.7), var(--hi); }
.cost-table th, .cost-table tfoot td, .plain-table th { background: rgba(30, 30, 36, 0.92); }

/* tiles float in space */
.tiles { perspective: 900px; }
.tile { transform-style: preserve-3d; transform: translateZ(0) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)); transition: transform 0.18s ease-out, box-shadow 0.2s ease, border-color 0.2s ease; will-change: transform; }
.tile > * { transform: translateZ(26px); }
.tile:hover, .tile.tilting { border-color: rgba(243, 136, 30, 0.75); background: linear-gradient(145deg, rgba(243, 136, 30, 0.20), rgba(255, 255, 255, 0.05)); box-shadow: 0 34px 56px -18px rgba(0, 0, 0, 0.85), 0 0 34px -8px rgba(243, 136, 30, 0.55), var(--hi); }
.tile:active { transform: translateZ(0) scale(0.985); }
.tile-primary { background: linear-gradient(145deg, #f9a24d 0%, #f3881e 55%, #d9720f 100%); border-color: rgba(255, 255, 255, 0.45); box-shadow: 0 30px 50px -18px rgba(243, 136, 30, 0.7), 0 6px 18px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.55), inset 0 -2px 0 rgba(0, 0, 0, 0.18); }
.tile-primary:hover { background: linear-gradient(145deg, #fbb261 0%, #f5921f 55%, #e07a12 100%); }

/* buttons: raised, lit from above */
.btn { border-radius: 16px; background: linear-gradient(180deg, #f9a24d, #f3881e 55%, #dd7510); border: 1px solid rgba(255, 255, 255, 0.35); box-shadow: 0 14px 24px -10px rgba(243, 136, 30, 0.75), 0 2px 6px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.5); color: #150b00; }
.btn:hover { background: linear-gradient(180deg, #fbb261, #f5921f 55%, #e27b13); border-color: rgba(255, 255, 255, 0.5); }
.btn-secondary, .btn-danger { background: var(--glass); border: 1px solid var(--glass-edge); color: #fff; box-shadow: var(--hi), 0 8px 18px -10px rgba(0, 0, 0, 0.7); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
.btn-secondary:hover { background: var(--glass-strong); border-color: #f3881e; color: #ffd2a1; }
.btn-danger { color: #ff8c82; border-color: rgba(255, 116, 104, 0.45); }
.btn-ghost { box-shadow: none; background: transparent; border-color: transparent; color: #ffc98f; }
.btn-danger-solid { background: linear-gradient(180deg, #ee5047, #cf3027); border-color: rgba(255, 255, 255, 0.3); color: #fff; }
.chip { border-radius: 99px; background: var(--glass); border: 1px solid var(--glass-edge); box-shadow: var(--hi); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
.chip[aria-pressed="true"] { background: linear-gradient(180deg, #f9a24d, #f3881e); color: #150b00; box-shadow: 0 10px 20px -8px rgba(243, 136, 30, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.5); }

/* inputs: recessed glass */
input[type="text"], input[type="number"], input[type="search"], select, textarea { background: rgba(0, 0, 0, 0.38); border: 1px solid rgba(255, 255, 255, 0.14); border-radius: 14px; box-shadow: inset 0 3px 8px rgba(0, 0, 0, 0.5), 0 1px 0 rgba(255, 255, 255, 0.06); }
input[type="text"]:focus, input[type="number"]:focus, input[type="search"]:focus, select:focus, textarea:focus { border-color: #f3881e; box-shadow: inset 0 3px 8px rgba(0, 0, 0, 0.5), 0 0 0 3px rgba(243, 136, 30, 0.3), 0 0 24px -4px rgba(243, 136, 30, 0.6); }
input[readonly] { background: rgba(255, 255, 255, 0.05); }
.date-input { background-color: rgba(0, 0, 0, 0.38) !important; }

/* dialogs and calendar float above everything */
.modal-back { background: rgba(4, 4, 8, 0.55); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
.modal { background: linear-gradient(150deg, rgba(48, 48, 58, 0.88), rgba(20, 20, 26, 0.92)); border: 1px solid var(--glass-edge); border-radius: 28px; box-shadow: 0 40px 80px -20px rgba(0, 0, 0, 0.9), 0 0 60px -20px rgba(243, 136, 30, 0.5), var(--hi); -webkit-backdrop-filter: blur(26px) saturate(160%); backdrop-filter: blur(26px) saturate(160%); }
.cal-nav { background: var(--glass); border-color: var(--glass-edge); box-shadow: var(--hi); }
.cal-day { border-radius: 14px; }
.cal-day.sel { background: linear-gradient(180deg, #f9a24d, #f3881e); box-shadow: 0 8px 16px -6px rgba(243, 136, 30, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.5); }
.toast { border-radius: 18px; background: rgba(30, 30, 38, 0.85); border: 1px solid rgba(243, 136, 30, 0.6); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); box-shadow: var(--depth), 0 0 30px -8px rgba(243, 136, 30, 0.5); }

/* footer floats as a small glass pill */
.app-footer { left: 50%; right: auto; transform: translateX(-50%); bottom: calc(6px + env(safe-area-inset-bottom, 0px)); width: max-content; max-width: calc(100% - 24px); padding: 5px 14px; border: 1px solid var(--glass-edge); border-radius: 99px; background: rgba(24, 24, 30, 0.92); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); color: #cfc6bb; box-shadow: var(--hi), 0 8px 20px -8px rgba(0, 0, 0, 0.7); }
body { padding-bottom: 44px; }
#toasts { bottom: calc(52px + env(safe-area-inset-bottom, 0px)) !important; }
.sync-chip { background: var(--glass); border-color: var(--glass-edge); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
.sync-code { background: rgba(0, 0, 0, 0.4); border: 1px dashed #f3881e; border-radius: 16px; box-shadow: inset 0 3px 10px rgba(0, 0, 0, 0.5); }

@media (prefers-reduced-motion: reduce) { .tile { transform: none !important; transition: none; } .tile > * { transform: none; } }
/* ===== Bento grid dashboard ===== */
.bento { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-flow: dense; gap: 12px; align-items: stretch; }

.bento > .top-logo { order: -3; } .bento > .masthead { order: -2; } .bento > .alert, .bento > .note { order: -1; }

/* ===== Simple tactile finish: soft raised cards, pressable buttons, clean type ===== */

<script>
/* spatial depth: tiles tilt gently toward the finger / pointer */
(function () {
  var cur = null;
  function reset() { if (cur) { cur.style.setProperty('--rx', '0deg'); cur.style.setProperty('--ry', '0deg'); cur.classList.remove('tilting'); cur = null; } }
  document.addEventListener('pointermove', function (e) {
    var t = e.target.closest && e.target.closest('.tile');
    if (!t) { reset(); return; }
    if (cur && cur !== t) reset();
    var r = t.getBoundingClientRect(), x = (e.clientX - r.left) / r.width - 0.5, y = (e.clientY - r.top) / r.height - 0.5;
    cur = t; t.classList.add('tilting');
    t.style.setProperty('--ry', (x * 9).toFixed(2) + 'deg'); t.style.setProperty('--rx', (-y * 9).toFixed(2) + 'deg');
  }, { passive: true });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (n) { document.addEventListener(n, reset, { passive: true }); });
  document.addEventListener('scroll', reset, { passive: true, capture: true });
})();
</script>

(function (root) {
  'use strict';

    ['machining', 'Machining'],

    ['fabrication', 'Fabrication'],

    ['profileCutting', 'Profile Cutting'],

    ['motors', 'Motors'],
    ['programming', 'Programming'],
    ['transport', 'Transport'],
    ['labour', 'Labour'],
    ['rubber', 'Rubber'],
    ['other', 'Other']
  ];
  var PO_STATUSES = ['PO Received', 'Design', 'Purchase', 'Assembly', 'Programming', 'Testing', 'Dispatch', 'Commissioning', 'Completed'];
  var PAY_STATUSES = ['Not Due', 'Due', 'Partially Paid', 'Paid'];
  var CURRENCIES = ['INR', 'USD', 'EUR', 'GBP', 'AED', 'SAR', 'SGD', 'AUD', 'CAD', 'JPY', 'CNY'];
  var DEFAULT_SETTINGS = { currency: 'INR', allowNegative: false, activeReminderDays: 3, paymentReminderDays: 30, quoteCounter: 0 };
  var DAY = 864e5;

  /* ---------- small helpers ---------- */
  function str(v) { return v === null || v === undefined ? '' : String(v); }
  function trim(v) { return str(v).trim(); }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function newId() {
    if (typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID();
    return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
  }
  function isDateStr(s) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(s || '')) return false;
    var p = s.split('-');
    var d = new Date(+p[0], +p[1] - 1, +p[2]);
    return d.getFullYear() === +p[0] && d.getMonth() === +p[1] - 1 && d.getDate() === +p[2];
  }

  function parseAmount(raw, allowNeg) {
    function bad(msg) { return { ok: false, value: 0, blank: false, error: msg }; }
    if (raw === null || raw === undefined) return { ok: true, value: 0, blank: true };
    var s = String(raw).trim();
    if (s === '') return { ok: true, value: 0, blank: true };

  }

    for (var i = 0; i < PARAMS.length; i++) c += toCents(costs ? costs[PARAMS[i][0]] : 0);

  }

  function dialog(o) {
    return new Promise(function (resolve) {
      var root = $('#modal-root');
      var prev = document.activeElement;
      root.innerHTML = '<div class="modal-back" data-back="1"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="dlg-title">' +
        '<h2 id="dlg-title">' + esc(o.title) + '</h2><div>' + (o.html || '') + '</div>' +
        '<div class="btn-row">' + o.actions.map(function (a, i) {
          return '<button type="button" class="btn ' + (a.cls || '') + '" data-i="' + i + '">' + esc(a.label) + '</button>';
        }).join('') + '</div></div></div>';
      function done(v) {
        document.removeEventListener('keydown', onKey, true);
        S.modalClose = null;
        root.innerHTML = '';
        if (prev && prev.focus) { try { prev.focus(); } catch (e) { /* ignore */ } }
        resolve(v);
      }
      function onKey(e) { if (e.key === 'Escape') { e.preventDefault(); done(undefined); } }
      document.addEventListener('keydown', onKey, true);
      S.modalClose = function () { done(undefined); };
      $('.modal-back', root).addEventListener('click', function (e) { if (e.target.getAttribute('data-back')) done(undefined); });
      $$('[data-i]', root).forEach(function (b) {
        b.addEventListener('click', function () {
          var a = o.actions[+b.getAttribute('data-i')];
          if (a.keep) { if (a.onClick) a.onClick(root); return; }

  /* ================= calendar date picker ================= */
  var MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function openCalendar(input) {
    var cur = /^\d{4}-\d{2}-\d{2}$/.test(input.value) ? input.value : '';
    var t = new Date(), todayIso = t.getFullYear() + '-' + pad2(t.getMonth() + 1) + '-' + pad2(t.getDate());
    var base = cur || todayIso;
    var yr = +base.slice(0, 4), mo = +base.slice(5, 7) - 1, picked;
    function grid() {
      var first = new Date(yr, mo, 1).getDay(), days = new Date(yr, mo + 1, 0).getDate();
      var h = '<div class="cal"><div class="cal-head"><button type="button" class="cal-nav" data-cal="-1" aria-label="Previous month">‹</button>' +
        '<strong>' + MONTHS[mo] + ' ' + yr + '</strong><button type="button" class="cal-nav" data-cal="1" aria-label="Next month">›</button></div><div class="cal-grid">' +
        ['Su','Mo','Tu','We','Th','Fr','Sa'].map(function (d) { return '<div class="cal-dow">' + d + '</div>'; }).join('');
      for (var i = 0; i < first; i++) h += '<div class="cal-blank"></div>';
      for (var d = 1; d <= days; d++) {
        var iso = yr + '-' + pad2(mo + 1) + '-' + pad2(d);
        h += '<button type="button" class="cal-day' + (iso === todayIso ? ' today' : '') + (iso === cur ? ' sel' : '') + '" data-day="' + iso + '">' + d + '</button>';
      }
      return h + '</div></div>';
    }
    var p = dialog({ title: 'Select date', html: '<div id="cal-box">' + grid() + '</div>',
      actions: [{ label: 'Cancel', cls: 'btn-secondary', value: 'cancel' }, { label: 'Today', cls: 'btn-secondary', value: 'today' }, { label: 'Clear', cls: 'btn-secondary', value: 'clear' }] });
    var box = $('#cal-box');
    function close() { var b = $('#modal-root [data-i="0"]'); if (b) b.click(); }
    box.addEventListener('click', function (e) {
      var nav = e.target.closest('[data-cal]'), day = e.target.closest('[data-day]');
      if (nav) { mo += +nav.getAttribute('data-cal'); if (mo < 0) { mo = 11; yr--; } if (mo > 11) { mo = 0; yr++; } box.innerHTML = grid(); }
      else if (day) { picked = day.getAttribute('data-day'); close(); }
    });
    p.then(function (v) {
      var val = picked || (v === 'today' ? todayIso : v === 'clear' ? '' : null);
      if (val === null) return;
      input.value = val;
      input.dispatchEvent(new Event('input', { bubbles: true }));
      input.dispatchEvent(new Event('change', { bubbles: true }));
    });
  }

  /* ================= PIN lock for "All Purchase Orders" and "Saved Quotations" ================= */
  var PIN_KEY = 'mbm:pin';
  function pinRec() { try { return JSON.parse(localStorage.getItem(PIN_KEY)) || null; } catch (e) { return null; } }
  function hasPin() { var r = pinRec(); return !!(r && r.hash); }
  async function pinHash(pin, salt) {
    var buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(salt + ':' + pin));
    return Array.prototype.map.call(new Uint8Array(buf), function (b) { return (b < 16 ? '0' : '') + b.toString(16); }).join('');
  }
  async function pinSave(pin) {
    var salt = Array.prototype.map.call(crypto.getRandomValues(new Uint8Array(8)), function (b) { return (b < 16 ? '0' : '') + b.toString(16); }).join('');
    localStorage.setItem(PIN_KEY, JSON.stringify({ salt: salt, hash: await pinHash(pin, salt) }));
  }
  async function pinCheck(pin) { var r = pinRec(); return !!r && (await pinHash(pin, r.salt)) === r.hash; }
  function askPin(title, msg) {
    var val = '';
    var p = dialog({ title: title, html: '<p class="muted">' + esc(msg) + '</p><input id="pin-in" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" placeholder="PIN" style="text-align:center;letter-spacing:0.4em;font-size:22px">',
      actions: [{ label: 'Cancel', cls: 'btn-secondary', value: null }, { label: 'OK', value: 'ok' }] });

      inp.focus();
    }
    return p.then(function (v) { return v === 'ok' ? val : null; });
  }
  async function verifyPin(title) {

  /* Phone back button: every in-app screen change adds a browser-history entry, so Android's
     back button (which walks the WebView history) returns to the previous screen. */
  var skipPop = 0;
  function histBack(n) { skipPop++; try { history.go(-n); } catch (e) { skipPop--; } }
  function go(name, p, opts) {
    opts = opts || {};
    if (needsPin(name, p) && hasPin() && !S.unlocked) {
      verifyPin(name === 'quoteList' ? 'Saved Quotations' : name === 'poList' ? 'All Purchase Orders' : 'Employee and salary details').then(function (ok) {
        if (ok) { S.unlocked = true; go(name, p, opts); }
      });
      return;

    if (name === 'dashboard') S.unlocked = false;
    if (name === 'dashboard') {
      var n = S.stack.length;

      S.stack.push(S.view);

  async function saveQuote() {

    if (!res.ok) { showErrors(res.errors, 'q-'); toast('Check the highlighted fields.', 'err'); return; }
    clearErrors();
    setBusy(true);
    try {
      var iso = new Date().toISOString(), editingId = S.view.p.id, rec;
      if (editingId) {
        var old = findQuote(editingId);
        if (!old) throw new Error('This quotation no longer exists.');
        rec = Object.assign({}, old, res.clean, { updatedAt: iso });
      } else {
        var seq = L.nextQuoteSeq(S.quotes, S.settings.quoteCounter);
        S.settings.quoteCounter = seq;
        await Store.saveSettings(S.settings);
        rec = Object.assign({ id: L.newId(), number: L.formatQuoteNumber(seq) }, res.clean, { createdAt: iso, updatedAt: iso });
      }
      rec.totalCost = L.totalCost(rec.costs);
      await Store.save('quotations', rec);
      upsert(S.quotes, rec);

  async function saveStatus(id) {
    if (S.busy) return;
    var po = findPO(id), sel = $('input[name="newstatus"]:checked');
    if (!po) { toast('This purchase order no longer exists.', 'err'); return; }
    if (!sel || sel.value === po.status) { toast('Pick a different status first. It is already ' + po.status + '.'); return; }
    setBusy(true);
    try {
      var rec = L.applyStatus(po, sel.value, new Date(), S.settings);
      await Store.save('pos', rec);
      upsert(S.pos, rec);
      back();
      var r = rec.reminder;
      toast('PO ' + rec.poNumber + ' is now ' + rec.status + '.' + (r ? ' Next reminder: ' + fmtDay(r.dueAt) + '.' : ''));
    } catch (e) { toast('Could not update the status: ' + errMsg(e), 'err'); }
    finally { setBusy(false); }
  }

  function updatePayOutstanding(po) {
    var el = $('#pay-out');
    if (!el || !po) return;
    if (po.value === null) { el.textContent = '—'; return; }
    var sel = $('input[name="paystatus"]:checked'), a = L.parseAmount($('#pay-paid').value, false);
    var paid = sel && sel.value === 'Paid' ? po.value : (a.ok ? a.value : 0);

  }
  async function savePayment(id) {
    if (S.busy) return;
    var po = findPO(id);
    if (!po) { toast('This purchase order no longer exists.', 'err'); return; }
    var sel = $('input[name="paystatus"]:checked');
    var res = L.validatePayment({ paymentStatus: sel ? sel.value : po.paymentStatus, amountPaid: $('#pay-paid').value, paymentDueDate: $('#pay-due').value, paymentRemarks: $('#pay-remarks').value }, po);
    if (!res.ok) {
      clearErrors();
      var map = { amountPaid: 'pay-paid', paymentDueDate: 'pay-due' };
      Object.keys(res.errors).forEach(function (k) {
        var el = $('#' + map[k]); if (!el) return;
        el.setAttribute('aria-invalid', 'true');
        var m = document.createElement('div'); m.className = 'field-err'; m.setAttribute('data-err', '1'); m.textContent = res.errors[k];
        el.closest('.field').appendChild(m);
        el.scrollIntoView({ block: 'center', behavior: 'smooth' });
      });
      toast('Check the highlighted fields.', 'err');
      return;
    }
    setBusy(true);
    try {
      var rec = L.applyPayment(po, res.clean, new Date(), S.settings);
      await Store.save('pos', rec);
      upsert(S.pos, rec);
      back();
      toast('Payment updated for PO ' + rec.poNumber + ': ' + rec.paymentStatus + '.' + (rec.paymentStatus === 'Paid' ? ' Payment reminder cancelled.' : ''));

    finally { setBusy(false); }
  }

    } else {

      '<div class="wide"><dt>Where your records are kept</dt><dd>' + esc(where) + '</dd></div></dl></div>');
  };

  /* ================= files: backup, export, restore ================= */
  async function saveBinary(filename, bytes) {
    var b64 = window.MBM_PDF.toBase64(bytes);
    if (window.NativeFileBridge && typeof window.NativeFileBridge.saveBase64 === 'function') {
      try { var sr = await window.NativeFileBridge.saveBase64(filename, b64, 'application/pdf'); toast(sr && sr.canceled ? 'Save cancelled.' : 'Saved ' + (sr && sr.path ? 'to ' + sr.path : filename) + '.'); return; }
      catch (nativeError) { console.warn('Native PDF export unavailable; downloading instead.', nativeError); }
    }
    var url = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }));
    var a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click();
    setTimeout(function () { a.remove(); URL.revokeObjectURL(url); }, 4000);
    toast('Saved ' + filename + '.');
  }
  function amountsLine(label, by) {
    var parts = Object.keys(by).map(function (cur) { return money(by[cur], cur); });
    return parts.length ? label + ': ' + parts.join('  ·  ') : null;
  }
  async function makeListsPdf() {
    if (!window.MBM_PDF) { toast('PDF export is not ready yet. Try again in a moment.', 'err'); return; }
    if (hasPin() && !S.unlocked && !(await verifyPin('PIN to create the PDF'))) return;
    var qs = L.sortQuotes(S.quotes), ps = L.sortPOs(S.pos, 'poDate');
    var quoteSec = {
      title: 'Saved Quotations', count: plural(qs.length, 'quotation'),
      cols: [{ h: '#', w: 0.04 }, { h: 'Quotation no.', w: 0.12 }, { h: 'Date', w: 0.10 }, { h: 'Customer', w: 0.20 }, { h: 'Project', w: 0.24 },
             { h: 'Total cost', w: 0.15, align: 'right' }, { h: 'Quoted amount', w: 0.15, align: 'right' }],
      rows: qs.map(function (q, i) { return [String(i + 1), q.number, fmtDay(q.date), q.customer, q.project, money(L.totalCost(q.costs), q.currency), q.quotedAmount === null || q.quotedAmount === undefined ? '—' : money(q.quotedAmount, q.currency)]; }),
      summary: [amountsLine('Total quoted', L.sumByCurrency(qs, function (x) { return x.quotedAmount; }))].filter(Boolean)
    };
    var poSec = {
      title: 'Purchase Orders', count: plural(ps.length, 'purchase order'),
      cols: [{ h: '#', w: 0.035 }, { h: 'PO no.', w: 0.09 }, { h: 'PO date', w: 0.08 }, { h: 'Customer', w: 0.135 }, { h: 'Project', w: 0.145 }, { h: 'Delivery', w: 0.08 },
             { h: 'Status', w: 0.10 }, { h: 'Payment', w: 0.085 }, { h: 'PO value', w: 0.085, align: 'right' }, { h: 'Outstanding', w: 0.085, align: 'right' }, { h: 'Pay due', w: 0.08 }],
      rows: ps.map(function (p, i) { return [String(i + 1), p.poNumber, fmtDay(p.poDate), p.customer, p.project, fmtDay(p.deliveryDate), p.status, p.paymentStatus, money(p.value, p.currency), money(L.outstanding(p), p.currency), fmtDay(p.paymentDueDate)]; }),
      summary: [amountsLine('Total PO value', L.sumByCurrency(ps, function (x) { return x.value; })),
                amountsLine('Total outstanding', L.sumByCurrency(ps.filter(function (x) { return x.paymentStatus !== 'Paid'; }), function (x) { return L.outstanding(x); }))].filter(Boolean)
    };
    toast('Making your PDF…');
    try {
      var bytes = await window.MBM_PDF.build({ sections: [quoteSec, poSec], subtitle: 'Backup of saved quotations and purchase orders · created ' + fmtDT(new Date().toISOString()) });
      await saveBinary('saved-lists-' + stamp() + '.pdf', bytes);
    } catch (e) { toast('Could not make the PDF: ' + errMsg(e), 'err'); }
  }

  async function saveFile(filename, text) {
    if (window.NativeFileBridge && typeof window.NativeFileBridge.saveFile === 'function') {
      try { var sf = await window.NativeFileBridge.saveFile(filename, text); toast(sf && sf.canceled ? 'Save cancelled.' : 'Saved ' + (sf && sf.path ? 'to ' + sf.path : filename) + '.'); return; }
      catch (nativeError) { console.warn('Native file export unavailable; showing copy fallback.', nativeError); }
    }
    var d = null;
    if (d) {
      try { await d.save({ filename: filename, data: text }); toast('Saved ' + filename + '.'); return; }
      catch (e) {
        if (e && e.code === 'declined') { toast('Download cancelled.'); return; }
        if (e && e.code === 'rate_limited') { toast('Wait a moment and try again.', 'err'); return; }
      }
    }
    await dialog({
      title: 'Copy ' + filename,
      html: '<p>Downloads are not available in this view. Copy the text below into a file named <b>' + esc(filename) + '</b>.</p><textarea id="copy-box" readonly>' + esc(text) + '</textarea>',
      actions: [
        { label: 'Close', value: true, cls: 'btn-secondary' },
        {
          label: 'Copy text', keep: true, onClick: function (root) {
            var ta = $('#copy-box', root); ta.focus(); ta.select();
            var p = navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(text) : Promise.reject();
            p.then(function () { toast('Copied.'); }, function () { try { document.execCommand('copy'); toast('Copied.'); } catch (e) { toast('Press and hold to copy the selected text.'); } });
          }
        }
      ]
    });
  }
  function stamp() { return L.todayLocal(); }
  async function handleRestoreFile(file) {
    if (!file) return;
    var text, obj;
    try { text = await file.text(); obj = JSON.parse(text); } catch (e) { toast('That file could not be read as a backup.', 'err'); return; }
    var v = L.validateBackup(obj);
    if (!v.ok) { toast(v.error, 'err'); return; }
    var overwrite = v.quotations.filter(function (q) { return findQuote(q.id); }).length + v.pos.filter(function (p) { return findPO(p.id); }).length;
    var ok = await confirmDialog('Restore this backup?',
      '<p>The file holds <b>' + plural(v.quotations.length, 'quotation') + '</b> and <b>' + plural(v.pos.length, 'purchase order') + '</b>' + (v.skipped ? ' (' + v.skipped + ' damaged entries will be skipped)' : '') + '.</p>' +
      '<p>' + (overwrite ? '<b>' + plural(overwrite, 'record') + '</b> already here will be replaced by the backup version. ' : 'Nothing here will be replaced. ') + 'Other records stay, and your settings stay.</p>', 'Restore', false);
    if (!ok) { toast('Restore cancelled. Nothing was changed.'); return; }
    S.busy = true;
    try {
      var restoredAt = new Date().toISOString(); // restored records count as fresh edits so phone sync keeps them
      for (var i = 0; i < v.quotations.length; i++) { v.quotations[i].updatedAt = restoredAt; await Store.save('quotations', v.quotations[i]); upsert(S.quotes, v.quotations[i]); }
      for (var j = 0; j < v.pos.length; j++) { v.pos[j].updatedAt = restoredAt; await Store.save('pos', v.pos[j]); upsert(S.pos, v.pos[j]); }
      S.settings.quoteCounter = Math.max(S.settings.quoteCounter, v.settings.quoteCounter, L.nextQuoteSeq(S.quotes, 0) - 1);
      await Store.saveSettings(S.settings);
      var officeNote = (window.MBM_OFFICE && obj.officeTools) ? window.MBM_OFFICE.restore(obj.officeTools) : '';
      toast('Restored ' + plural(v.quotations.length, 'quotation') + ' and ' + plural(v.pos.length, 'purchase order') + '.' + officeNote);
    } catch (e) { toast('Restore stopped part way: ' + errMsg(e), 'err'); }
    finally { S.busy = false; render(); }
  }

  /* ================= deleting ================= */
  async function deleteQuote(id) {
    var q = findQuote(id); if (!q) return;
    var linked = S.pos.filter(function (p) { return p.quotationId === id; }).length;
    var ok = await confirmDialog('Delete ' + q.number + '?',
      '<p><b>' + esc(q.customer) + '</b> · ' + esc(q.project) + '</p><p>This cannot be undone. The quotation number will not be used again.' +
      (linked ? ' ' + plural(linked, 'linked purchase order') + ' will be kept.' : '') + '</p>', 'Delete quotation', true);
    if (!ok) return;
    try {
      await Store.remove('quotations', id);
      S.quotes = S.quotes.filter(function (x) { return x.id !== id; });
      if (S.view.name === 'quoteDetail') back(); else render();
      toast(q.number + ' deleted.');
    } catch (e) { toast('Could not delete: ' + errMsg(e), 'err'); }
  }
  async function deletePO(id) {
    var po = findPO(id); if (!po) return;
    var ok = await confirmDialog('Delete PO ' + po.poNumber + '?',
      '<p><b>' + esc(po.customer) + '</b>' + (po.project ? ' · ' + esc(po.project) : '') + '</p><p>This cannot be undone. Any linked quotation is not affected.</p>', 'Delete PO', true);
    if (!ok) return;
    try {
      await Store.remove('pos', id);
      S.pos = S.pos.filter(function (x) { return x.id !== id; });
      if (S.view.name === 'poDetail') back(); else render();
      toast('PO ' + po.poNumber + ' deleted.');
    } catch (e) { toast('Could not delete: ' + errMsg(e), 'err'); }
  }

  /* ================= actions ================= */
  AFTER.settings = function () {
    var el = $('#notify-status'); if (!el) return;
    if (!window.NativeNotify) { el.textContent = 'Notifications work only in the installed Windows app.'; return; }
    window.NativeNotify.status().then(function (st) {
      el.innerHTML = st === 'granted' ? '<b class="pos">Notifications are on.</b> Use the button below to check one now.'
        : '<b class="neg">Notifications are off.</b> Click the button below. If nothing appears, open Windows Settings, System, Notifications, make sure notifications are on for this app and Focus assist (Do not disturb) is off.';
    });
  };

  var ACTIONS = {
    setPin: async function () {
      var a = await askNewPin('Set PIN'); if (a === null) return;
      await pinSave(a); toast('PIN saved. It is now needed to open All Purchase Orders, Saved Quotations and the employee and salary screens.'); render();
    },
    changePin: async function () {
      if (!(await verifyPin('Current PIN'))) return;
      var a = await askNewPin('New PIN'); if (a === null) return;
      await pinSave(a); toast('PIN changed.'); render();
    },
    removePin: async function () {
      if (!(await verifyPin('Enter PIN to remove it'))) return;
      localStorage.removeItem(PIN_KEY); S.unlocked = false; toast('PIN removed.'); render();
    },
    toggleTheme: function () {
      var next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', next);
      try { localStorage.setItem('mbm:theme', next); } catch (e) { /* ignore */ }
      var m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute('content', next === 'light' ? '#f5f2ed' : '#07070a');
    },
    testNotify: function () {
      if (!window.NativeNotify) { toast('Notifications work only in the installed Windows app.', 'err'); return; }
      window.NativeNotify.test().then(function (ok) {
        toast(ok ? 'Test notification sent. It should pop up at the bottom right of the screen.' : 'Notifications are blocked. Open Windows Settings, System, Notifications, and switch them on for Manufacturing Business Manager (also turn off Focus assist).', ok ? null : 'err');
        AFTER.settings();
      });
    },
    home: function () { go('dashboard'); },
    back: function () { back(); },
    go: function (el) { go(el.dataset.to, el.dataset.id ? { id: el.dataset.id } : {}); },
    openPOList: function (el) { S.poUI.q = ''; S.poUI.filter = 'all'; go('poList', el.dataset.preset ? { preset: el.dataset.preset } : {}); },
    backToPOList: function () { var prev = S.stack[S.stack.length - 1]; if (prev && prev.name === 'poList') back(); else ACTIONS.openPOList({ dataset: { preset: '' } }); },
    setFilter: function (el) { S.poUI.filter = el.dataset.filter; render(); },
    clearPOSearch: function () { S.poUI.q = ''; render(); },
    clearQuoteSearch: function () { S.quoteUI.q = ''; render(); },
    newQuote: function () { go('quoteForm', {}, { replace: S.view.name === 'quoteForm' }); window.scrollTo(0, 0); },
    newPO: function () { go('poForm', {}, { replace: true }); },
    saveQuote: saveQuote,
    clearQuote: clearQuoteForm,
    deleteQuote: function (el) { deleteQuote(el.dataset.id); },
    poFromQuote: function (el) { go('poForm', { quoteId: el.dataset.id }); },
    savePO: savePO,
    clearPO: clearPOForm,
    deletePO: function (el) { deletePO(el.dataset.id); },
    saveStatus: function (el) { saveStatus(el.dataset.id); },
    savePayment: function (el) { savePayment(el.dataset.id); },
    reminderOpen: function (el) {
      var po = findPO(el.dataset.id); if (!po) return;
      var r = L.reminderOf(po, S.settings);
      go(r && r.kind === 'payment' ? 'poPayment' : 'poStatus', { id: po.id });
    },
    snooze: async function (el) {
      var po = findPO(el.dataset.id); if (!po || S.busy) return;
      var r = L.snoozeReminder(po, new Date(), S.settings); if (!r) return;
      try {
        var rec = Object.assign({}, po, { reminder: r });
        await Store.save('pos', rec); upsert(S.pos, rec);
        render();
        toast('Reminder moved to ' + fmtDay(r.dueAt) + '.');
      } catch (e) { toast('Could not change the reminder: ' + errMsg(e), 'err'); }
    },
    backup: function () {
      saveFile('manufacturing-backup-' + stamp() + '.json', JSON.stringify(L.makeBackup(S.quotes, S.pos, S.settings, new Date()), null, 2));
    },
    pdfBackup: function () { makeListsPdf(); },
    exportQuotes: function () { saveFile('quotations-' + stamp() + '.csv', L.quotesCSV(S.quotes)); },
    exportPOs: function () { saveFile('purchase-orders-' + stamp() + '.csv', L.posCSV(S.pos)); },
    retryLoad: async function () {
      try { await reload(); S.loadError = ''; } catch (e) { S.loadError = errMsg(e); }
      render();
    }
  };

  app.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    var h = ACTIONS[el.dataset.act];
    if (h) { e.preventDefault(); h(el, e); }
  });
  app.addEventListener('submit', function (e) { e.preventDefault(); });
  app.addEventListener('input', function (e) {
    var t = e.target;
    if (t.classList.contains('cost-input') || t.id === 'q-quoted') updateQuoteTotals();
    else if (t.id === 'po-value' || t.id === 'po-paid') updatePOOutstanding();
    else if (t.id === 'pay-paid') updatePayOutstanding(findPO(S.view.p.id));
    else if (t.id === 'quote-search') { S.quoteUI.q = t.value; $('#quote-list').innerHTML = quoteListHtml(); }
    else if (t.id === 'po-search') { S.poUI.q = t.value; $('#po-list').innerHTML = poListHtml(S.view.p); }
  });
  app.addEventListener('change', async function (e) {
    var t = e.target;
    if (t.id === 'q-currency') updateQuoteTotals();
    else if (t.id === 'po-currency') updatePOOutstanding();
    else if (t.id === 'po-paystatus') {
      if (t.value === 'Paid') { var v = L.parseAmount($('#po-value').value, false); if (v.ok && !v.blank) $('#po-paid').value = String(L.roundMoney(v.value)); }
      updatePOOutstanding();
    } else if (t.id === 'po-quote') {
      var q = findQuote(t.value);
      if (q && S.view.name === 'poForm' && !S.view.p.id) {
        if (!$('#po-customer').value.trim()) $('#po-customer').value = q.customer;
        if (!$('#po-project').value.trim()) $('#po-project').value = q.project;
        if (!$('#po-value').value.trim() && q.quotedAmount !== null) $('#po-value').value = String(q.quotedAmount);
        $('#po-currency').value = q.currency;
        updatePOOutstanding();
      }
    } else if (t.name === 'paystatus') {
      var po = findPO(S.view.p.id);
      if (po && t.value === 'Paid' && po.value !== null) $('#pay-paid').value = String(po.value);
      updatePayOutstanding(po);
    } else if (t.id === 'po-sort') { S.poUI.sort = t.value; $('#po-list').innerHTML = poListHtml(S.view.p); }
    else if (t.id === 'restore-file') { var f = t.files && t.files[0]; t.value = ''; handleRestoreFile(f); }
    else if (t.id === 'set-currency' || t.id === 'set-neg' || t.id === 'set-active' || t.id === 'set-pay') {
      var next = Object.assign({}, S.settings);
      if (t.id === 'set-currency') next.currency = t.value;
      if (t.id === 'set-neg') next.allowNegative = t.checked;
      if (t.id === 'set-active' || t.id === 'set-pay') {
        var n = parseInt(t.value, 10);
        if (!(n >= 1 && n <= 365)) { toast('Enter a whole number of days from 1 to 365.', 'err'); t.value = t.id === 'set-active' ? S.settings.activeReminderDays : S.settings.paymentReminderDays; return; }
        if (t.id === 'set-active') next.activeReminderDays = n; else next.paymentReminderDays = n;
      }
      try { await Store.saveSettings(next); S.settings = next; toast('Settings saved.'); }
      catch (err) { toast('Could not save settings: ' + errMsg(err), 'err'); }
    }
  });

  document.addEventListener('visibilitychange', function () {
    if (document.hidden || Store.mode !== 'cloud' || S.busy) return;
    var n = S.view.name;
    if (['dashboard', 'quoteList', 'quoteDetail', 'poList', 'poDetail', 'reminders'].indexOf(n) < 0) return;
    if ($('#modal-root').firstChild) return;
    reload().then(function () { var y = window.scrollY; render(); window.scrollTo(0, y); }, function () { /* keep what is on screen */ });
  });

  /* ================= start ================= */
  async function boot() {
    try { await Store.init(); await reload(); }
    catch (e) { S.loadError = errMsg(e); }
    S.view = { name: 'dashboard', p: {} }; S.stack = [];
    try { history.pushState({ mbm: 0 }, ''); } catch (e) { /* ignore */ }  // spare entry so Back can close a dialog on the dashboard
    render();
    notifyNativeDataChanged();
  }
  window.MBM_APP = { S: S, Store: Store, go: go, back: back, render: render, toast: toast, SCREENS: SCREENS, AFTER: AFTER, ACTIONS: ACTIONS, TITLES: TITLES,
    shell: shell, esc: esc, dialog: dialog, confirmDialog: confirmDialog, fmtDay: fmtDay, plural: plural, saveFile: saveFile, saveBinary: saveBinary, notFound: notFound, customerNames: customerNames, stats: stats, dueReminders: dueReminders, money: money };
  boot();
})();

</script>
