
name: Build SparkTech Business Manager for Windows

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Download project source
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install project dependencies
        run: npm install

      - name: Run project tests
        run: npm test

      - name: Build Windows installer and portable app
        run: npm run dist

      - name: Upload Windows EXE files
        uses: actions/upload-artifact@v4
        with:
          name: Manufacturing-Business-Manager-Windows
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14

